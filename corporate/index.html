<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corporate • Juri Prinz Photography</title>

  <!-- Zentrales Stylesheet wie auf der Landing Page -->
  <link rel="stylesheet" href="/css/menu.css?v=16" />

  <!-- Optional: Page-spezifische Meta -->
  <meta name="description" content="Corporate Fotografie: Mitarbeiter-Portraits, Team, Office & Event – modern, clean, on brand." />
  <meta name="theme-color" content="#000000" />

  <style>
    :root{
      --gap: 12px;
      --card-scale: 0.75;        /* Breite der Karten auf der linken Spalte */
      --pad-top: 10vh;
      --pad-bot: 10vh;
      --auto-speed: 40;          /* px/s Autoscroll */
      --split-desktop: 42vw;     /* Breite linke Spalte (Desktop) */
    }

    /* Grundlayout */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#000;color:#fff;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    /* === KEIN Header-Logo auf dieser Seite (bewusst weggelassen) === */

    /* Burger-Button: identisch zur Landing-Page (Markup & IDs sind gleich) */
    .hamburger{
      position:fixed; top:28px; right:24px;
      width:30px; height:22px; z-index:60; cursor:pointer;
      background:none; border:none;
    }
    .hamburger span{
      display:block; width:100%; height:3px; margin:5px 0;
      background:#fff; border-radius:3px; transition:.25s;
    }
    .hamburger.active span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
    .hamburger.active span:nth-child(2){ opacity:0; }
    .hamburger.active span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

    /* Die Menü-Styles selbst kommen aus /css/menu.css?v=16
       (menu-overlay, menu-list, .socials, SVG-Sizing etc.) */

    /* Seite: Split-Layout */
    .page{display:flex;height:100vh;width:100vw;}

    .left{
      position:relative;width:var(--split-desktop);height:100%;
      overflow-y:auto; overflow-x:hidden;
      border-right:1px solid rgba(255,255,255,.08);
      padding:var(--pad-top) 24px calc(var(--pad-bot) - var(--gap));
      overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    }
    .stream{position:relative;}
    .set{display:flex;flex-direction:column;gap:var(--gap);}
    .card{width:calc(100% * var(--card-scale)); margin:0 auto;}
    .card img{
      width:100%; aspect-ratio:3/4; height:auto; object-fit:cover;
      border-radius:12px; display:block; filter:brightness(.95);
      transition:transform .28s ease, filter .28s ease;
    }
    .card img:hover{ transform:scale(1.02); filter:brightness(1); }

    .right{flex:1; position:relative; overflow:hidden;}
    .video-wrap{ position:absolute; inset:0; overflow:hidden; }
    .video-wrap video{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; filter:brightness(.62) contrast(1.05) saturate(1.05);
    }

    /* Weicher Radial-Gradient – Mitte nur ~10% abgedunkelt */
    .video-overlay-gradient{
      position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(110% 110% at 50% 50%,
          rgba(0,0,0,0.10) 0%,
          rgba(0,0,0,0.25) 40%,
          rgba(0,0,0,0.50) 70%,
          rgba(0,0,0,0.78) 100%);
    }

    /* dezente Logo-Wasserzeichen unten rechts */
    .logo-watermark{
      position:absolute; right:2.2%; bottom:2.2%;
      width:86px; opacity:.55; z-index:20; pointer-events:none;
    }

    /* Responsive */
    @media (max-width: 1100px){
      :root{ --split-desktop: 48vw; --card-scale: 0.82; }
    }
    @media (max-width: 900px){
      .page{flex-direction:column;}
      .right{height:53vh;}
      .left{
        width:100vw; height:47vh; border-right:none;
        border-top:1px solid rgba(255,255,255,.08);
        padding:10vh 16px calc(10vh - var(--gap));
      }
      .logo-watermark{width:72px; right:3%; bottom:3%;}
    }
  </style>
</head>
<body>

  <!-- Burger (gleich wie Landing-Page) -->
  <button class="hamburger" id="hamburger" aria-label="Menü">
    <span></span><span></span><span></span>
  </button>

  <!-- Overlay-Menü (gleiches Markup & Social-SVGs wie Landing-Page) -->
  <div class="menu-overlay" id="menu" aria-hidden="true">
    <nav class="menu-nav" aria-label="Hauptmenü">
      <ul class="menu-list">
        <li><a class="menu-link" href="/index.html">Home</a></li>
        <li><a class="menu-link" href="/portrait/index.html">Portrait</a></li>
        <li><a class="menu-link" href="/event/index.html">Event</a></li>
        <li><a class="menu-link" href="/landscape/index.html">Landscape</a></li>
        <li><a class="menu-link" href="/corporate/index.html">Corporate</a></li>
        <li><a class="menu-link" href="/about/index.html">About</a></li>
        <li><a class="menu-link" href="/behind/index.html">Behind the Scenes</a></li>
      </ul>

      <!-- exakt wie auf der Landing-Page -->
      <ul class="socials">
        <li><a class="is-stroke" href="https://www.instagram.com/juri_prinz_/" target="_blank" aria-label="Instagram" style="--fit-stroke: 84%;"><img src="/img/social/instagram.svg" alt="Instagram"></a></li>
        <li><a class="is-fill" href="https://www.facebook.com/juri.prinz/" target="_blank" aria-label="Facebook"><img src="/img/social/facebook.svg" alt="Facebook"></a></li>
        <li><a class="is-fill" href="https://www.youtube.com/@1Prinz" target="_blank" aria-label="YouTube"><img src="/img/social/youtube.svg" alt="YouTube"></a></li>
        <li><a class="is-fill" href="https://www.linkedin.com/in/juri-prinz-5b1008a8/" target="_blank" aria-label="LinkedIn" style="--fit-fill: 92%;"><img src="/img/social/linkedin.svg" alt="LinkedIn"></a></li>
        <li><a class="is-fill" href="https://t.me/prinz_juri" target="_blank" aria-label="Telegram" style="--fit-fill: 100%;"><img src="/img/social/telegram.svg" alt="Telegram"></a></li>
        <li><a class="is-stroke" href="https://wa.me/41767788891" target="_blank" aria-label="WhatsApp" style="--fit-stroke: 84%;"><img src="/img/social/whatsapp.svg" alt="WhatsApp"></a></li>
        <li><a class="is-stroke" href="mailto:prinz_juri@online.de" aria-label="E-Mail"><img src="/img/social/mail.svg" alt="E-Mail"></a></li>
      </ul>
    </nav>
  </div>

  <main class="page">
    <!-- Linke Scroll-Spalte -->
    <section class="left" id="gallery">
      <div class="stream" id="stream">
        <div class="set" id="setA">
          <!-- ersetzbar durch echte Corporate-Motive -->
          <a class="card"><img src="/img/corp_01.jpg" alt="Corporate 1"></a>
          <a class="card"><img src="/img/corp_02.jpg" alt="Corporate 2"></a>
          <a class="card"><img src="/img/corp_03.jpg" alt="Corporate 3"></a>
          <a class="card"><img src="/img/corp_04.jpg" alt="Corporate 4"></a>
          <a class="card"><img src="/img/corp_05.jpg" alt="Corporate 5"></a>
          <a class="card"><img src="/img/corp_06.jpg" alt="Corporate 6"></a>
          <a class="card"><img src="/img/corp_07.jpg" alt="Corporate 7"></a>
          <a class="card"><img src="/img/corp_08.jpg" alt="Corporate 8"></a>
          <a class="card"><img src="/img/corp_09.jpg" alt="Corporate 9"></a>
          <a class="card"><img src="/img/corp_10.jpg" alt="Corporate 10"></a>
        </div>
        <div class="set" id="setB"></div>
      </div>
    </section>

    <!-- Rechte Video-Spalte -->
    <section class="right">
      <div class="video-wrap">
        <video autoplay muted loop playsinline preload="auto">
          <source src="/video/Ricardo_ZXXV.mp4" type="video/mp4" />
        </video>
        <div class="video-overlay-gradient"></div>
      </div>
      <img class="logo-watermark" src="/img/logo_inverted.png" alt="Juri Prinz Logo">
    </section>
  </main>

  <!-- Gleiches Menü-JS wie auf Landing-Page (IDs sind identisch) -->
  <script src="/js/menu.js?v=11" defer></script>

  <!-- Page-spezifisches JS (Auto-Scroll + Burger fallback) -->
  <script>
    // Fallback-Toggle, falls menu.js noch nicht geladen wäre
    document.addEventListener('DOMContentLoaded', () => {
      const burger = document.getElementById('hamburger');
      const menu = document.getElementById('menu');
      if (burger && menu) {
        const toggle = (open) => {
          const willOpen = (typeof open === 'boolean') ? open : !menu.classList.contains('active');
          burger.classList.toggle('active', willOpen);
          menu.classList.toggle('active', willOpen);
          menu.setAttribute('aria-hidden', String(!willOpen));
          document.body.style.overflow = willOpen ? 'hidden' : '';
        };
        burger.addEventListener('click', () => toggle());
        document.querySelectorAll('.menu-link, .socials a').forEach(a => {
          a.addEventListener('click', () => toggle(false));
        });
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && menu.classList.contains('active')) toggle(false);
        });
      }

      // ===== Endlos-Scroll für die linke Spalte =====
      const gallery = document.getElementById('gallery');
      const setA = document.getElementById('setA');
      const setB = document.getElementById('setB');
      const speed = Number(getComputedStyle(document.documentElement).getPropertyValue('--auto-speed')) || 40;

      function imagesReady(scope){
        const imgs = Array.from(scope.querySelectorAll('img'));
        if(imgs.length===0) return Promise.resolve();
        return Promise.all(imgs.map(img=>{
          if(img.complete) return Promise.resolve();
          return new Promise(res=>{
            img.addEventListener('load', res, {once:true});
            img.addEventListener('error', res, {once:true});
          });
        }));
      }

      let running=false, last=performance.now(), setHeight=0;

      function ensureHeight(){
        // Duplizieren, bis genug Inhalt zum Loopen da ist
        setB.innerHTML = setA.innerHTML;
        const target = gallery.clientHeight * 2;
        const stream = document.getElementById('stream');
        while (stream.scrollHeight < target){
          setB.innerHTML += setA.innerHTML;
        }
        setHeight = setA.offsetHeight || (stream.scrollHeight / 2);
      }

      function loop(now){
        const dt = (now - last) / 1000; last = now;
        if(running){
          gallery.scrollTop += speed * dt;
          if(gallery.scrollTop >= setHeight){
            gallery.scrollTop -= setHeight;
          }
        }
        requestAnimationFrame(loop);
      }

      (async function init(){
        await imagesReady(setA);
        ensureHeight();
        running = true;
        last = performance.now();
        requestAnimationFrame(loop);
      })();

      gallery.addEventListener('mouseenter',()=> running = false);
      gallery.addEventListener('mouseleave',()=> running = true);
      window.addEventListener('resize', () => {
        // bei Resize Höhe neu kalkulieren
        ensureHeight();
      });
    });
  </script>
</body>
</html>
