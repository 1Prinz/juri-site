<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Corporate • Juri Prinz Photography</title>
  <link rel="canonical" href="https://juri-prinz.de/corporate/" />

  <!-- Globales Menü/CSS wie Landing -->
  <link rel="stylesheet" href="/css/menu.css?v=16" />

  <!-- Meta (kurz gehalten) -->
  <meta name="description" content="Corporate-Fotografie: Business Portraits, Team, On-Location – Bodensee & Schweiz." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="/img/favicon/favicon-32.png" />

  <style>
    :root{
      --gap: 12px;
      --split-desktop: 42vw;   /* Anteil linke Spalte Desktop */
      --auto-speed: 40;        /* px/s Autoscroll */
      --pad-top: 10vh;
      --pad-bot: 10vh;
    }

    /* Seite */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#000;color:#fff;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    /* ===== Header + Burger (lassen wir vom globalen CSS stylen) ===== */
    header{ position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:30; pointer-events:none; }
    header img{ width:160px; max-width:40vw; height:auto; opacity:.95 }
    /* Burger & Overlay kommen aus /css/menu.css – nur Z-Index feinjustieren: */
    .hamburger{ z-index:100 }         /* sicher über allem klickbar */
    .menu-overlay{ z-index:90 }       /* über Content, unter Burger */

    /* ===== Layout Split ===== */
    .page{ display:flex; height:100vh; width:100vw; }

    /* Linke Spalte: Auto-Scroll Galerie */
    .left{
      position:relative; width:var(--split-desktop); height:100%;
      overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      border-right:1px solid rgba(255,255,255,.08);
      padding:var(--pad-top) 24px calc(var(--pad-bot) - var(--gap));
      z-index:10;
    }
    .stream{ position:relative; }
    .set{ display:flex; flex-direction:column; gap:var(--gap); }
    .card{ width:calc(100% * 0.75); margin:0 auto; }
    .card img{
      width:100%; aspect-ratio:3/4; height:auto; object-fit:cover;
      border-radius:12px; display:block; filter:brightness(.95);
      transition:transform .28s ease, filter .28s ease;
    }
    .card img:hover{ transform:scale(1.02); filter:brightness(1) }

    /* Rechte Spalte: Video mit Vignette */
    .right{ flex:1; position:relative; overflow:hidden; z-index:5; }
    .video-wrap{ position:absolute; inset:0; overflow:hidden; }
    .video-wrap video{
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      filter:brightness(.8) contrast(1.05) saturate(1.05);
      z-index:1;
    }
    /* Posterbild falls du eins zeigen willst (optional, sonst display:none) */
    .hero-poster{
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      filter:brightness(.8) contrast(1.05) saturate(1.05);
      z-index:1; display:none;     /* auf Wunsch aktivieren */
    }

    /* Weiche Vignette: Mitte heller (~10%), Ränder zunehmend dunkel */
    .video-vignette{
      position:absolute; inset:0; pointer-events:none; z-index:2;
      background:
        radial-gradient(
          circle at 50% 55%,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,0) 25%,
          rgba(0,0,0,.20) 50%,
          rgba(0,0,0,.50) 75%,
          rgba(0,0,0,.80) 100%
        );
      /* Für Safari weichzeichnen, damit’s super smooth ausläuft */
      -webkit-backdrop-filter: blur(0px);
    }

    /* kleines Logo unten rechts im Video (kannst du weglassen) */
    .logo-watermark{
      position:absolute; right:2.2%; bottom:2.2%; width:86px; opacity:.55; z-index:3; pointer-events:none;
    }

    /* Mobile */
    @media (max-width:900px){
      .page{ flex-direction:column; }
      .right{ height:53vh; }
      .left{
        width:100vw; height:47vh; border-right:none;
        border-top:1px solid rgba(255,255,255,.08);
        padding:10vh 16px calc(10vh - var(--gap));
      }
      .logo-watermark{ width:72px; right:3%; bottom:3% }
    }
  </style>
</head>
<body>



  <!-- Burger (gleich wie Landing) -->
  <button class="hamburger" id="hamburger" aria-label="Menü">
    <span></span><span></span><span></span>
  </button>

  <!-- Overlay-Menü (gleich wie Landing) -->
  <div class="menu-overlay" id="menu" aria-hidden="true">
    <nav class="menu-nav" aria-label="Hauptmenü">
      <ul class="menu-list">
        <li><a href="/" class="menu-link">Home</a></li>
        <li><a href="/portrait/" class="menu-link">Portrait</a></li>
        <li><a href="/event/" class="menu-link">Event</a></li>
        <li><a href="/landscape/" class="menu-link">Landscape</a></li>
        <li><a href="/corporate/" class="menu-link">Corporate</a></li>
        <li><a href="/about/" class="menu-link">About</a></li>
        <li><a href="/bts/" class="menu-link">Behind the Scenes</a></li>
      </ul>

      <!-- Socials: exakt wie Landing -->
      <ul class="socials">
        <li><a class="is-stroke" href="https://www.instagram.com/juri_prinz_/" target="_blank" aria-label="Instagram" style="--fit-stroke:84%"><img src="/img/social/instagram.svg" alt="Instagram"></a></li>
        <li><a class="is-fill"   href="https://www.facebook.com/juri.prinz/" target="_blank" aria-label="Facebook"><img src="/img/social/facebook.svg" alt="Facebook"></a></li>
        <li><a class="is-fill"   href="https://www.youtube.com/@1Prinz"      target="_blank" aria-label="YouTube"><img src="/img/social/youtube.svg"  alt="YouTube"></a></li>
        <li><a class="is-fill"   href="https://www.linkedin.com/in/juri-prinz-5b1008a8/" target="_blank" aria-label="LinkedIn" style="--fit-fill:92%"><img src="/img/social/linkedin.svg" alt="LinkedIn"></a></li>
        <li><a class="is-fill"   href="https://t.me/prinz_juri"               target="_blank" aria-label="Telegram" style="--fit-fill:100%"><img src="/img/social/telegram.svg" alt="Telegram"></a></li>
        <li><a class="is-stroke" href="https://wa.me/41767788891"             target="_blank" aria-label="WhatsApp" style="--fit-stroke:84%"><img src="/img/social/whatsapp.svg" alt="WhatsApp"></a></li>
        <li><a class="is-stroke" href="mailto:prinz_juri@online.de"                     aria-label="E-Mail"><img src="/img/social/mail.svg" alt="E-Mail"></a></li>
      </ul>
    </nav>
  </div>

  <main class="page">
    <!-- Linke Auto-Scroll-Galerie -->
    <section class="left" id="gallery">
      <div class="stream" id="stream">
        <div class="set" id="setA">
          <a class="card"><img src="/img/corp_01.jpg" alt="Corporate 1"></a>
          <a class="card"><img src="/img/corp_02.jpg" alt="Corporate 2"></a>
          <a class="card"><img src="/img/corp_03.jpg" alt="Corporate 3"></a>
          <a class="card"><img src="/img/corp_04.jpg" alt="Corporate 4"></a>
          <a class="card"><img src="/img/corp_05.jpg" alt="Corporate 5"></a>
          <a class="card"><img src="/img/corp_06.jpg" alt="Corporate 6"></a>
          <a class="card"><img src="/img/corp_07.jpg" alt="Corporate 7"></a>
          <a class="card"><img src="/img/corp_08.jpg" alt="Corporate 8"></a>
          <a class="card"><img src="/img/corp_09.jpg" alt="Corporate 9"></a>
          <a class="card"><img src="/img/corp_10.jpg" alt="Corporate 10"></a>
        </div>
        <div class="set" id="setB"></div>
      </div>
    </section>

    <!-- Rechte Video-Fläche mit Vignette -->
    <section class="right">
      <div class="video-wrap">
        <video autoplay muted loop playsinline preload="auto">
          <source src="/video/Ricardo_ZXXV.mp4" type="video/mp4" />
        </video>
        <!-- Optionales Poster, falls du Video deaktivieren willst:
        <img class="hero-poster" src="/img/corporate_hero_16x9.jpg" alt="Corporate Hero">
        -->
        <div class="video-vignette"></div>
      </div>
      <img class="logo-watermark" src="/img/logo_inverted.png" alt="Juri Prinz Logo">
    </section>
  </main>

  <!-- Gleiches Menü-JS wie Landing -->
  <script src="/js/menu.js?v=11" defer></script>

  <!-- Autoscroll nur für die linke Spalte (mobil bleibt an) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gallery = document.getElementById('gallery');
      const setA = document.getElementById('setA');
      const setB = document.getElementById('setB');
      const speed = Number(getComputedStyle(document.documentElement).getPropertyValue('--auto-speed')) || 40;

      function imagesReady(scope){
        const imgs = Array.from(scope.querySelectorAll('img'));
        if(imgs.length===0) return Promise.resolve();
        return Promise.all(imgs.map(img=>{
          if(img.complete) return Promise.resolve();
          return new Promise(res=>{
            img.addEventListener('load', res, {once:true});
            img.addEventListener('error', res, {once:true});
          });
        }));
      }

      let running=false, last=performance.now(), setHeight=0;
      function ensureHeight(){
        setB.innerHTML = setA.innerHTML;
        const need = gallery.clientHeight * 2;
        const stream = document.getElementById('stream');
        while (stream.scrollHeight < need){
          setB.innerHTML += setA.innerHTML;
        }
        setHeight = setA.offsetHeight || (stream.scrollHeight / 2);
      }

      function loop(now){
        const dt = (now - last) / 1000; last = now;
        if(running){
          gallery.scrollTop += speed * dt;
          if(gallery.scrollTop >= setHeight){
            gallery.scrollTop -= setHeight;
          }
        }
        requestAnimationFrame(loop);
      }

      (async function init(){
        await imagesReady(setA);
        ensureHeight();
        running = true;
        last = performance.now();
        requestAnimationFrame(loop);
      })();

      gallery.addEventListener('mouseenter',()=> running = false);
      gallery.addEventListener('mouseleave',()=> running = true);
      window.addEventListener('resize', ensureHeight);
    });
  </script>
</body>
</html>
